version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: trustvault-db
    environment:
      POSTGRES_DB: trustvault_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustvault_dev_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/TrustVault.Api
      dockerfile: Dockerfile
    container_name: trustvault-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=trustvault_db;Username=postgres;Password=trustvault_dev_password_2026;
      - Jwt__Issuer=TrustVault
      - Jwt__Audience=TrustVaultUsers
      - Jwt__SecretKey=TrustVaultSuperSecretKeyForDevelopment2026!MustBeAtLeast32BytesLongForHmacSha256
      - Storage__LocalVaultPath=/app/storage
    ports:
      - "5115:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - vault_storage:/app/storage

volumes:
  postgres_data:
  vault_storage:
